name: docker

on:
  push:
    branches:
      - unstable
      - stable
      - testnet
      - mainnet
    tags:
      - v*

env:
  DOCKER_PASSWORD: ${{ secrets.DH_KEY }}
  DOCKER_USERNAME: ${{ secrets.DH_ORG }}
  IMAGE_NAME: ${{ secrets.DH_ORG }}/siren

jobs:
  # Extract the VERSION which is either `latest` or `vX.Y.Z`, and the VERSION_SUFFIX
  # which is empty, `-unstable`, `-testnet`, or `-mainnet`.
  #
  # It would be nice if the arch didn't get spliced into the version between `latest` and
  # `unstable`, but for now we keep the two parts of the version separate for backwards
  # compatibility.
  extract-version:
    runs-on: ubuntu-22.04
    steps:
      - name: Extract version (if stable)
        if: github.event.ref == 'refs/heads/stable'
        run: |
          echo "VERSION=latest" >> $GITHUB_ENV
          echo "VERSION_SUFFIX=" >> $GITHUB_ENV
      - name: Extract version (if unstable)
        if: github.event.ref == 'refs/heads/unstable'
        run: |
          echo "VERSION=latest" >> $GITHUB_ENV
          echo "VERSION_SUFFIX=-unstable" >> $GITHUB_ENV
      - name: Extract version (if tagged release)
        if: startsWith(github.event.ref, 'refs/tags')
        run: |
          echo "VERSION=$(echo ${GITHUB_REF#refs/tags/})" >> $GITHUB_ENV
          echo "VERSION_SUFFIX=" >> $GITHUB_ENV
      - name: Extract version (if testnet)
        if: github.event.ref == 'refs/heads/testnet'
        run: |
          echo "VERSION=latest" >> $GITHUB_ENV
          echo "VERSION_SUFFIX=-testnet" >> $GITHUB_ENV
      - name: Extract version (if mainnet)
        if: github.event.ref == 'refs/heads/mainnet'
        run: |
          echo "VERSION=latest" >> $GITHUB_ENV
          echo "VERSION_SUFFIX=-mainnet" >> $GITHUB_ENV
    outputs:
      VERSION: ${{ env.VERSION }}
      VERSION_SUFFIX: ${{ env.VERSION_SUFFIX }}

  build-docker-single-arch:
    name: build-docker-${{ matrix.binary }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - binary: aarch64
            short_arch: arm64
            runner: ubuntu-22.04-arm
          - binary: x86_64
            short_arch: amd64
            runner: ubuntu-22.04

    needs: [extract-version]
    env:
      # We need to enable experimental docker features in order to use `docker buildx`
      DOCKER_CLI_EXPERIMENTAL: enabled
      VERSION: ${{ needs.extract-version.outputs.VERSION }}
      VERSION_SUFFIX: ${{ needs.extract-version.outputs.VERSION_SUFFIX }}
    steps:
      - uses: actions/checkout@v4
      - name: Dockerhub login
        run: |
          echo "${DOCKER_PASSWORD}" | docker login --username ${DOCKER_USERNAME} --password-stdin
      - name: Set Docker build args (chain / RPC)
        run: |
          case "${GITHUB_REF}" in
            refs/heads/testnet)
              echo "NEXT_PUBLIC_TESTNET_CHAIN_ID=72080" >> $GITHUB_ENV
              echo "NEXT_PUBLIC_TESTNET_RPC=https://rpc.testnet.nexera.network" >> $GITHUB_ENV
              ;;
            refs/heads/mainnet)
              echo "NEXT_PUBLIC_TESTNET_CHAIN_ID=7208" >> $GITHUB_ENV
              echo "NEXT_PUBLIC_TESTNET_RPC=https://rpc.nexera.network" >> $GITHUB_ENV
              ;;
            *)
              echo "NEXT_PUBLIC_TESTNET_CHAIN_ID=72080" >> $GITHUB_ENV
              echo "NEXT_PUBLIC_TESTNET_RPC=https://rpc.testnet.nexera.network" >> $GITHUB_ENV
              ;;
          esac
      - name: Build Dockerfile and push
        run: |
          docker buildx build \
              --platform=linux/${{ matrix.short_arch }} \
              --file ./Dockerfile . \
              --build-arg NEXT_PUBLIC_TESTNET_CHAIN_ID=${NEXT_PUBLIC_TESTNET_CHAIN_ID} \
              --build-arg NEXT_PUBLIC_TESTNET_RPC=${NEXT_PUBLIC_TESTNET_RPC} \
              --tag ${IMAGE_NAME}:${VERSION}-${{ matrix.short_arch }}${VERSION_SUFFIX} \
              --push

  build-docker-multiarch:
    name: build-docker-multiarch
    runs-on: ubuntu-22.04
    needs: [build-docker-single-arch, extract-version]
    env:
      # We need to enable experimental docker features in order to use `docker manifest`
      DOCKER_CLI_EXPERIMENTAL: enabled
      VERSION: ${{ needs.extract-version.outputs.VERSION }}
      VERSION_SUFFIX: ${{ needs.extract-version.outputs.VERSION_SUFFIX }}
    steps:
      - name: Dockerhub login
        run: |
          echo "${DOCKER_PASSWORD}" | docker login --username ${DOCKER_USERNAME} --password-stdin
      - name: Create and push multiarch manifest
        run: |
          docker manifest create ${IMAGE_NAME}:${VERSION}${VERSION_SUFFIX} \
              --amend ${IMAGE_NAME}:${VERSION}-arm64${VERSION_SUFFIX} \
              --amend ${IMAGE_NAME}:${VERSION}-amd64${VERSION_SUFFIX};
          docker manifest push ${IMAGE_NAME}:${VERSION}${VERSION_SUFFIX}
